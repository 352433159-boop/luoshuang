name: 🧠 盘中AI深度解读 云端兜底

permissions:
  contents: write

on:
  schedule:
    # 北京时间 14:30 = UTC 06:30
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧠 生成并推送云端深度分析
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/cloud_deep_analysis.py

      - name: 💾 深度分析报告入库
        run: |
          git config user.name "codex"
          git config user.email "codex@local"
          git add reports/cloud_deep_analysis_*.html reports/latest_cloud_deep_analysis.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update cloud deep analysis $(date +%Y%m%d)"
          git push
