name: 📚 每日学习计划

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 📦 安装依赖
        run: pip install requests
      - name: 🏃 推送学习计划
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/daily_learning.py
