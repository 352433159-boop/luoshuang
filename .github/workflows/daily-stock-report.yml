name: 📊 A股投资者日报

permissions:
  contents: write

on:
  schedule:
    # 北京时间 15:10 = UTC 07:10
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🏃 生成并推送A股投资者日报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/cloud_a_share_daily.py

      - name: 💾 日报入库
        run: |
          git config user.name "codex"
          git config user.email "codex@local"
          git add reports/latest_a_share_daily.html reports/a_share_daily_*.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update A-share investor daily $(date +%Y%m%d)"
          git push
