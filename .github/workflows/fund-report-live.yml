name: 📊 基金晨报 云端实时

permissions:
  contents: write

on:
  schedule:
    # 北京时间 14:30 = UTC 06:30
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📊 生成并推送云端实时晨报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/cloud_fund_report.py

      - name: 💾 报告入库并推回GitHub
        run: |
          git config user.name "codex"
          git config user.email "codex@local"
          git add reports/
          git diff --cached --quiet || git commit -m "update fund report $(date +%Y%m%d)"
          git push
